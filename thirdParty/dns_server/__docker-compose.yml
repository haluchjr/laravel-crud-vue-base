services:
  dnsmasq:
    image: alpine:latest
    container_name: dnsmasq_local
    # O comando abaixo atualiza o Alpine, instala o dnsmasq e roda ele em primeiro plano (-k)
    command: sh -c "apk add --no-cache dnsmasq && dnsmasq -k"
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
      # Se você usar o arquivo de hosts separado:
      # - ./dnsmasq.hosts:/etc/dnsmasq.hosts:ro
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    cap_add:
      - NET_ADMIN
    restart: always