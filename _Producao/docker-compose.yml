services:
  prod_backend:
    image: sistema:${TAG} # Pega a tag gerada pelo script de build
    container_name: prod_backend # FIXO
    restart: unless-stopped
    ports:
      - "${PORTA_HTTP}:80" # Porta final da produção (ex: 8080 mapeando para a 80 interna)
    env_file:
      - .env # Lê as configurações e chaves reais do .env
    environment:
      - TMPDIR=/tmp
      - TMP=/tmp
    depends_on:
      - prod_cache
      - prod_db_mysql
    networks:
      - app-net

  prod_cache:
    image: redis:7-alpine
    container_name: prod_cache # FIXO - Alinhado perfeitamente com REDIS_HOST=producao_cache
    restart: unless-stopped
    ports:
      - "${PORTA_REDIS}:6379" # Mapeia a porta externa (ex: 6380) para a 6379 interna
    volumes:
      - cache_redis:/data
    networks:
      - app-net

  prod_db_mysql:
    image: mysql:8.0
    container_name: prod_db_mysql # FIXO - Alinhado perfeitamente com DB_HOST=producao_db_mysql
    restart: unless-stopped
    command: --authentication_policy=mysql_native_password
    ports:
      - "${PORTA_MYSQL}:3306" # Mapeia a porta externa (ex: 3307) para a 3306 interna
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

volumes:
  cache_redis:
  db_data:

networks:
  app-net:
    driver: bridge