# PRODUCAO
services:
  backend:
    image: meu-app-php:${TAG} # Pega a tag gerada pelo script
    container_name: ${COMPOSE_PROJECT_NAME}_backend
    restart: unless-stopped
    ports:
      - "${PORTA_HTTP}:80" # Porta final da produção (ex: 80)
    env_file:
      - .env # Lê as senhas reais de produção do arquivo externo
    environment:
      - TMPDIR=/tmp
      - TMP=/tmp
    depends_on:
      - cache
      - db_mysql
    networks:
      - app-net

  cache:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_cache
    restart: unless-stopped
    ports:
      - "${PORTA_REDIS}:6379"
    volumes:
      - cache_redis:/data
    networks:
      - app-net

  db_mysql:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME}_db_mysql
    restart: unless-stopped
    command: --authentication_policy=mysql_native_password
    ports:
      - "${PORTA_MYSQL}:3306"
    env_file:
      - .env # Banco também usa as senhas do .env externo
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

volumes:
  cache_redis:
  db_data:

networks:
  app-net:
    driver: bridge