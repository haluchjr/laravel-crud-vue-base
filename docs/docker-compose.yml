services:
  app_web:
    container_name: app
    user: "root"
    build:
      context: ./docker/php8.3
      network: host
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${USER_ID:-1000}"
    restart: unless-stopped
    ports:
      - "8020:80"
    environment:
      - TMPDIR=/tmp
      - TMP=/tmp
    volumes:
      - ./:/var/www/html
    depends_on:
      - cache
      - db
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - app-net

  vite:
    image: node:20-alpine
    container_name: node
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - app_web

  cache:
    image: redis:7-alpine
    container_name: cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cache_redis:/data
    networks:
      - app-net

  db:
    image: mysql:8.0
    container_name: db_mysql
    restart: unless-stopped
    command: --authentication_policy=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

volumes:
  cache_redis:
  db_data:

networks:
  app-net:
    driver: bridge
